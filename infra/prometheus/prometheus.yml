global: { scrape_interval: 2s, evaluation_interval: 5s }
scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ['api1:8080']
        labels: { replica: api-1 }
      - targets: ['api2:8080']
        labels: { replica: api-2 }
      - targets: ['api3:8080']
        labels: { replica: api-3 }
  - job_name: worker
    static_configs:
      - targets: ['worker:9100']
        labels: { replica: worker }
